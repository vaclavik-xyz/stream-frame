<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Stream Frame — live VR view</title>
<style>
  :root { color-scheme: dark; --fg:#e8e8ef; --dim:#8a8a98; --accent:#6ee7b7; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#0b0b0f; color:var(--fg);
              font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  video { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #msg { position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom));
         text-align:center; font-size:14px; color:var(--dim); pointer-events:none; }
  #hud { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top)); padding:8px 12px;
         border-radius:10px; background:rgba(10,10,14,.62); backdrop-filter:blur(8px);
         font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim);
         opacity:0; transition:opacity .25s; pointer-events:none; white-space:pre; }
  #hud.on { opacity:1; }
  #hud b { color:var(--accent); font-weight:600; }
  #bar { position:fixed; right:12px; top:calc(12px + env(safe-area-inset-top)); display:flex; gap:8px; }
  #bar button { font:12px/1 inherit; color:var(--fg); background:rgba(10,10,14,.62);
         border:1px solid rgba(255,255,255,.14); border-radius:9px; padding:8px 11px; cursor:pointer;
         backdrop-filter:blur(8px); }
  #bar button:hover { border-color:var(--accent); color:var(--accent); }
  body.clean #bar, body.clean #hud, body.clean #msg, body.clean #gaze { display:none; }
  #gaze { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  #stale { position:fixed; left:50%; top:calc(10px + env(safe-area-inset-top)); transform:translateX(-50%);
           background:#b45309ee; color:#fff; font:600 13px/1.4 system-ui,sans-serif; padding:6px 12px;
           border-radius:999px; display:none; z-index:6; pointer-events:none }
  #stale.on { display:block }
  #gazebadge { position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom));
        font:11px/1 ui-monospace,Menlo,monospace; color:var(--dim); opacity:.85; padding:6px 9px;
        border-radius:8px; background:rgba(10,10,14,.62); display:none; }
  #bar button.on { border-color:var(--accent); color:var(--accent); }

  /* ---- the quiet layer: it frames the picture instead of covering it ---- */
  #film { position:fixed; inset:0; pointer-events:none; z-index:2;
          background:
            radial-gradient(120% 90% at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.28) 100%),
            linear-gradient(to bottom, rgba(0,0,0,.20), rgba(0,0,0,0) 18%,
                            rgba(0,0,0,0) 82%, rgba(0,0,0,.30)); }
  /* above the browser's own control bar, which would otherwise sit on top of them */
  #chips { position:fixed; left:14px; bottom:calc(56px + env(safe-area-inset-bottom)); z-index:5;
           display:flex; gap:6px; align-items:center; flex-wrap:wrap; max-width:calc(100% - 28px);
           font:11px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.02em;
           transition:opacity .5s; opacity:.9; pointer-events:none; }
  #chips.idle { opacity:.22; }
  #chips span { padding:5px 8px; border-radius:7px; color:#cfcfda;
                background:rgba(10,10,14,.52); border:1px solid rgba(255,255,255,.07);
                backdrop-filter:blur(6px); }
  #chips b { color:var(--accent); font-weight:600; }
  #chips .live b { color:#f87171; }
  #chips .live i { display:inline-block; width:6px; height:6px; margin-right:5px; border-radius:50%;
                   background:#f87171; vertical-align:1px; animation:pulse 2.4s ease-in-out infinite; }
  #chips .rec b { color:#fca5a5; }
  #chips span.off { display:none; }
  @keyframes pulse { 0%,100% { opacity:1 } 50% { opacity:.25 } }
  #mark { position:fixed; right:14px; bottom:calc(56px + env(safe-area-inset-bottom)); z-index:5;
          font:500 11px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; letter-spacing:.18em;
          text-transform:uppercase; color:#e8e8ef; opacity:.24; pointer-events:none; }
  body.clean #film, body.clean #chips, body.clean #mark { display:none; }

  /* ---- settings drawer ---- */
  #panel { position:fixed; z-index:9; right:0; top:0; height:100%; width:min(360px, 92vw);
           transform:translateX(102%); transition:transform .28s cubic-bezier(.2,.8,.2,1);
           background:rgba(12,12,17,.92); backdrop-filter:blur(18px);
           border-left:1px solid rgba(255,255,255,.09); padding:calc(16px + env(safe-area-inset-top))
           16px calc(16px + env(safe-area-inset-bottom)); overflow-y:auto;
           font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #panel.on { transform:none; }
  #panel h2 { margin:0 0 2px; font-size:15px; font-weight:600; letter-spacing:.01em; }
  #panel p.hint { margin:0 0 14px; color:var(--dim); font-size:11.5px; }
  #panel .row { margin:0 0 13px; }
  #panel .row label { display:flex; justify-content:space-between; gap:10px; color:#c9c9d4;
                      font-size:12px; margin-bottom:5px; }
  #panel .row label output { color:var(--accent); font:12px ui-monospace,Menlo,monospace; }
  #panel input[type=range] { width:100%; accent-color:var(--accent); }
  #panel select, #panel input[type=number] { width:100%; background:rgba(255,255,255,.05);
        color:var(--fg); border:1px solid rgba(255,255,255,.12); border-radius:8px; padding:7px 8px;
        font:12px inherit; }
  #panel .toggle { display:flex; align-items:center; justify-content:space-between; gap:12px;
        padding:9px 0; border-top:1px solid rgba(255,255,255,.06); }
  #panel .toggle:first-of-type { border-top:0; }
  #panel .switch { position:relative; width:40px; height:22px; flex:0 0 auto; }
  #panel .switch input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
  #panel .switch i { position:absolute; inset:0; border-radius:999px; background:rgba(255,255,255,.14);
        transition:background .2s; }
  #panel .switch i::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px;
        border-radius:50%; background:#e8e8ef; transition:transform .2s; }
  #panel .switch input:checked + i { background:rgba(110,231,183,.55); }
  #panel .switch input:checked + i::after { transform:translateX(18px); }
  #panel .warn { background:rgba(180,83,9,.16); border:1px solid rgba(180,83,9,.5); border-radius:9px;
        padding:9px 10px; color:#fcd34d; font-size:11.5px; margin:12px 0; }
  #panel .actions { display:flex; gap:8px; margin-top:16px; }
  #panel .actions button { flex:1; font:13px/1 inherit; padding:11px; border-radius:9px; cursor:pointer;
        border:1px solid rgba(255,255,255,.14); background:rgba(255,255,255,.05); color:var(--fg); }
  #panel .actions button.primary { background:rgba(110,231,183,.16); border-color:rgba(110,231,183,.5);
        color:var(--accent); font-weight:600; }
  #panel .actions button:disabled { opacity:.45; cursor:default; }
  #panel .state { margin-top:10px; font-size:11.5px; color:var(--dim); min-height:1.3em; }
  #panel .state.err { color:#fca5a5; }
  #panel .state.ok { color:var(--accent); }
</style>
</head>
<body>
<video id="v" playsinline autoplay muted controls></video>
<canvas id="gaze"></canvas>
<div id="gazebadge"></div>
<div id="stale"></div>
<div id="msg">connecting…</div>
<div id="hud"></div>
<div id="film"></div>
<div id="chips">
  <span class="live"><i></i><b>live</b></span>
  <span id="chip-mode">hls</span>
  <span id="chip-fps"></span>
  <span id="chip-rate"></span>
  <span id="chip-age"></span>
  <span class="rec off" id="chip-rec"><b>rec</b> <span id="chip-rec-time">0:00</span></span>
</div>
<div id="mark">Stream Frame</div>
<div id="bar">
  <button id="mode" title="switch transport">webrtc</button>
  <button id="stats" title="toggle stats (t)">stats</button>
  <button id="gazebtn" title="eye tracking reticle (g)">gaze</button>
  <button id="settings" title="settings (s)">⚙</button>
  <button id="fs" title="fullscreen (f)">⤢</button>
</div>
<div id="panel">
  <h2>Stream Frame</h2>
  <p class="hint">Changes reach the headset. Anything the encoder cannot take while running restarts it —
     the picture blinks for a second.</p>
  <div id="panel-body"></div>
  <div class="actions">
    <button id="panel-close">close</button>
    <button id="panel-apply" class="primary">apply</button>
  </div>
  <div class="state" id="panel-state"></div>
</div>
<script>
(function () {
  "use strict";
  const TOKEN = "__TOKEN__";
  const LAYOUT = "__LAYOUT__";
  // explicit --webrtc-url wins, otherwise assume MediaMTX sits on the same host
  const WHEP = ("__WEBRTC__" || (location.protocol + "//" + location.hostname + ":8889/vr"))
               .replace(/\/+$/, "") + "/whep";

  const v = document.getElementById("v");
  const msg = document.getElementById("msg");
  const hud = document.getElementById("hud");
  const modeBtn = document.getElementById("mode");
  const qs = (s) => (TOKEN ? s + (s.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN) : s);

  const wantHls = location.hash.includes("hls") || new URLSearchParams(location.search).has("hls");
  const isApple = /iPad|iPhone|iPod/.test(navigator.userAgent);
  let mode = wantHls || isApple || !window.RTCPeerConnection ? "hls" : "webrtc";

  let lastTime = -1, lastMove = Date.now(), restarts = 0, restarting = false;
  let status = null, pc = null, whepUrl = null, lastBytes = 0, kbps = 0;

  const say = (text) => { if (msg.textContent !== text) msg.textContent = text; };
  const beacon = (text) => { try { fetch(qs("log?e=" + encodeURIComponent(mode + " " + text))); } catch (e) {} };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ---------------------------------------------------------------- HLS
  function attachHls() {
    restarting = false;
    v.srcObject = null;
    v.src = qs("live.m3u8?t=" + Date.now());
    lastMove = Date.now(); lastTime = -1;
    const p = v.play();
    if (p && p.catch) p.catch(() => say("tap the video to start"));
  }

  function restartHls(why) {
    if (restarting) return;
    restarting = true; restarts++;
    if (restarts >= 2 && !wantHls && window.RTCPeerConnection) {
      beacon("hls keeps failing — switching to webrtc");
      setMode("webrtc");
      return;
    }
    say("reconnecting (" + why + ")…");
    beacon(why + " restarts=" + restarts);
    try { v.pause(); } catch (e) {}
    v.removeAttribute("src"); v.load();
    setTimeout(attachHls, 400 + Math.min(restarts * 300, 2500));
  }

  // ---------------------------------------------------------------- WebRTC (WHEP)
  async function startWhep() {
    say("connecting (webrtc)…");
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });
    pc.ontrack = (ev) => {
      if (ev.streams && ev.streams[0]) v.srcObject = ev.streams[0];
      v.play().catch(() => say("tap the video to start"));
      restarts = 0;
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
        beacon("pc " + pc.connectionState);
        teardown(); setTimeout(() => (mode === "webrtc" ? startWhep().catch(fallbackHls) : null), 1500);
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await new Promise((res) => {                 // non-trickle: wait for candidates
      if (pc.iceGatheringState === "complete") return res();
      const done = () => pc.iceGatheringState === "complete" && res();
      pc.addEventListener("icegatheringstatechange", done);
      setTimeout(res, 2500);
    });

    const res = await fetch(WHEP, {
      method: "POST",
      headers: { "Content-Type": "application/sdp" },
      body: pc.localDescription.sdp,
    });
    if (!res.ok) throw new Error("whep " + res.status);
    whepUrl = res.headers.get("Location") || null;
    await pc.setRemoteDescription({ type: "answer", sdp: await res.text() });
    say("");
  }

  function teardown() {
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    if (whepUrl) { try { fetch(new URL(whepUrl, WHEP).href, { method: "DELETE" }); } catch (e) {} whepUrl = null; }
    v.srcObject = null;
  }

  function fallbackHls(err) {
    beacon("webrtc failed: " + (err && err.message));
    mode = "hls"; syncModeButton();
    say("webrtc unavailable — using HLS");
    attachHls();
  }

  function startWebrtc() {
    startWhep().catch(fallbackHls);
  }

  // ---------------------------------------------------------------- mode
  function syncModeButton() { modeBtn.textContent = mode === "hls" ? "hls" : "webrtc"; }

  function setMode(next) {
    if (next === mode) return;
    teardown();
    try { v.pause(); } catch (e) {}
    v.removeAttribute("src"); v.load();
    mode = next; syncModeButton(); restarts = 0;
    if (mode === "hls") attachHls(); else startWebrtc();
  }

  modeBtn.onclick = () => setMode(mode === "hls" ? "webrtc" : "hls");

  // ---------------------------------------------------------------- events
  v.addEventListener("error", () => {
    if (mode !== "hls") return;
    const e = v.error;
    beacon("error " + ((e && e.code) || "?") + ":" + ((e && e.message) || ""));
    restartHls("player error");
  });
  v.addEventListener("stalled", () => { if (mode === "hls") beacon("stalled t=" + v.currentTime.toFixed(1)); });
  v.addEventListener("waiting", () => { if (mode === "hls") beacon("waiting t=" + v.currentTime.toFixed(1)); });
  v.addEventListener("playing", () => { restarts = 0; lastMove = Date.now(); say(""); });

  if (mode === "hls") attachHls(); else startWebrtc();
  syncModeButton();

  // a frozen HTTP stream does not always fire an error - watch the clock
  setInterval(() => {
    if (mode !== "hls" || v.paused || v.ended) return;
    if (v.currentTime !== lastTime) { lastTime = v.currentTime; lastMove = Date.now(); return; }
    if (lastTime > 0.5 && Date.now() - lastMove > 5000) restartHls("frozen");
  }, 1000);

  // status polling doubles as the keep-alive for the on-demand encoder
  setInterval(() => {
    fetch(qs("status?t=" + Date.now())).then((r) => r.json()).then((j) => {
      status = j;
      if (j.fps < 5) say("VR is not rendering — put the headset on or start a game");
      else if (v.currentTime > 0 || (pc && pc.connectionState === "connected")) say("");
      // the playlist keeps rolling from the last frames, so the server is the only honest clock
      const pic = j.picture || {};
      if (pic.frozen && pic.age != null) showStale("picture frozen — last frame " + pic.age.toFixed(0) + " s ago");
      else if (pic.age != null && pic.age > 3) showStale("picture is " + pic.age.toFixed(0) + " s old");
      else showStale("");
      renderHud();
      renderChips();
    }).catch(() => {});
  }, 3000);

  const staleEl = document.getElementById("stale");
  function showStale(text) {
    staleEl.textContent = text;
    staleEl.classList.toggle("on", !!text);
  }

  function renderHud() {
    if (!hud.classList.contains("on") || !status) return;
    let transport;
    if (mode === "hls") {
      const buffered = v.buffered.length ? (v.buffered.end(v.buffered.length - 1) - v.currentTime) : 0;
      transport = "hls   buffer " + buffered.toFixed(1) + " s\n";
    } else {
      transport = "webrtc  " + (pc ? pc.connectionState : "off") + "\n";
    }
    hud.innerHTML =
      "capture   <b>" + status.fps.toFixed(1) + "</b> fps\n" +
      "encoder   " + (status.encoder ? "<b>on</b>" : "off") + "  " + (status.bitrate || "") + "  " + LAYOUT + "\n" +
      transport +
      "restarts  " + status.restarts + "  (player " + restarts + ")\n" +
      "picture   " + (status.picture && status.picture.age != null
        ? status.picture.age.toFixed(1) + " s old (" + status.picture.source + ")"
          + (status.picture.torn ? "  torn " + status.picture.torn : "")
        : "no frame yet") + "\n" +
      "record    " + (status.record && status.record.enabled
        ? '<a href="' + qs("recordings") + '">' + status.record.files + " file(s), "
          + (status.record.bytes / 1048576).toFixed(0) + " MB</a>"
        : "off") + "\n" +
      "viewers   " + status.readers +
      (status.gaze && status.gaze.enabled
        ? "\ngaze      " + (status.gaze.available
            ? "<b>" + status.gaze.rate.toFixed(0) + "</b> Hz  age " + status.gaze.age + " s"
            : "off (" + (status.gaze.error || "no data") + ")")
        : "");
  }

  // ---------------------------------------------------------------- gaze
  // The eye server publishes head-relative gaze; the picture is one eye's view, so the reticle is
  // placed with the --gaze-fov rectangle. It is a read-out, not a headset-accurate projection.
  const gcanvas = document.getElementById("gaze");
  const gctx = gcanvas.getContext("2d");
  const gbadge = document.getElementById("gazebadge");
  const gbtn = document.getElementById("gazebtn");
  let es = null, gazeTimer = null, sample = null, trail = [];
  let gazeOn = localStorage.getItem("vrstream.gaze") === "1";

  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    gcanvas.width = Math.round(innerWidth * dpr);
    gcanvas.height = Math.round(innerHeight * dpr);
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeCanvas();
  addEventListener("resize", sizeCanvas);

  function videoRect() {
    if (!v.videoWidth) return { x: 0, y: 0, w: innerWidth, h: innerHeight };   // no picture yet
    const vw = v.videoWidth, vh = v.videoHeight;
    const scale = Math.min(innerWidth / vw, innerHeight / vh);
    const w = vw * scale, h = vh * scale;
    return { x: (innerWidth - w) / 2, y: (innerHeight - h) / 2, w, h };
  }

  function draw() {
    gctx.clearRect(0, 0, innerWidth, innerHeight);
    if (!gazeOn) return;
    if (sample && sample.available && typeof sample.x === "number") {
      const r = videoRect();
      const px = r.x + ((sample.x + 1) / 2) * r.w;
      const py = r.y + ((1 - sample.y) / 2) * r.h;
      trail.push([px, py]);
      if (trail.length > 14) trail.shift();
      trail.forEach(([tx, ty], i) => {
        const a = (i + 1) / trail.length;
        gctx.beginPath();
        gctx.arc(tx, ty, 2 + 5 * a, 0, Math.PI * 2);
        gctx.fillStyle = "rgba(110,231,183," + (0.05 + 0.18 * a) + ")";
        gctx.fill();
      });
      gctx.beginPath();
      gctx.arc(px, py, 9, 0, Math.PI * 2);
      gctx.strokeStyle = "rgba(110,231,183,.95)"; gctx.lineWidth = 2; gctx.stroke();
      gctx.beginPath();
      gctx.arc(px, py, 2.5, 0, Math.PI * 2);
      gctx.fillStyle = "rgba(110,231,183,.95)"; gctx.fill();
      gbadge.style.display = "block";
      gbadge.textContent = "gaze " + Math.round(sample.yaw) + "° / " + Math.round(sample.pitch) +
                           "°  lids " + sample.open_l.toFixed(2) + " " + sample.open_r.toFixed(2);
    }
  }

  function gazeConnect() {
    if (es) return;
    es = new EventSource(qs("gaze.sse"));
    es.onmessage = (ev) => {
      try { sample = JSON.parse(ev.data); } catch (e) { return; }
      gbtn.classList.toggle("on", !!sample.available);
      if (!sample.available) {
        gbadge.style.display = "block";
        gbadge.textContent = "gaze: " + (sample.error || "no data from the eye server");
      }
    };
    es.onerror = () => { sample = null; };
  }

  function gazeSet(on) {
    gazeOn = on;
    localStorage.setItem("vrstream.gaze", on ? "1" : "0");
    gbtn.classList.toggle("on", on);
    // a plain interval, not requestAnimationFrame: rAF is throttled to zero in a background tab,
    // which is exactly where a stream like this often runs
    if (on) { gazeConnect(); if (!gazeTimer) gazeTimer = setInterval(draw, 33); }
    else {
      if (gazeTimer) { clearInterval(gazeTimer); gazeTimer = null; }
      if (es) { es.close(); es = null; }
      sample = null; trail = [];
      gctx.clearRect(0, 0, innerWidth, innerHeight); gbadge.style.display = "none";
    }
  }
  gbtn.onclick = () => gazeSet(!gazeOn);
  if (gazeOn) gazeSet(true);

  document.getElementById("stats").onclick = () => { hud.classList.toggle("on"); renderHud(); };
  document.getElementById("fs").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };


  // ---------------------------------------------------------------- chips, idle fade
  const chipsEl = document.getElementById("chips");
  const chipMode = document.getElementById("chip-mode");
  const chipFps = document.getElementById("chip-fps");
  const chipRate = document.getElementById("chip-rate");
  const chipAge = document.getElementById("chip-age");
  const chipRec = document.getElementById("chip-rec");
  const chipRecTime = document.getElementById("chip-rec-time");
  let lastActivity = Date.now();
  const wake = () => { lastActivity = Date.now(); chipsEl.classList.remove("idle"); };
  ["pointermove", "pointerdown", "keydown", "touchstart"].forEach((name) =>
    addEventListener(name, wake, { passive: true }));

  function renderChips() {
    chipMode.textContent = mode === "hls" ? "hls" : "webrtc";
    if (Date.now() - lastActivity > 4000 && !panel.classList.contains("on")) chipsEl.classList.add("idle");
    if (!status) return;
    const height = v.videoHeight || 0;
    chipFps.textContent = (height ? height + "p" : (status.encoder ? "encoding" : "no signal")) +
                          (status.fps ? " · " + Math.round(status.fps) + " fps" : "");
    chipRate.textContent = status.bitrate || "";
    const pic = status.picture || {};
    chipAge.textContent = pic.age == null ? "" :
      (pic.age < 1 ? "in sync" : pic.age.toFixed(0) + " s behind");
    const rec = status.record || {};
    const on = !!(rec.enabled && status.encoder);
    chipRec.classList.toggle("off", !on);
    if (on && rec.since) {
      const t = Math.max(0, Math.floor(Date.now() / 1000 - rec.since));
      chipRecTime.textContent = Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
    }
  }
  setInterval(renderChips, 1000);

  // ---------------------------------------------------------------- settings drawer
  const panel = document.getElementById("panel");
  const panelBody = document.getElementById("panel-body");
  const panelState = document.getElementById("panel-state");
  const panelApply = document.getElementById("panel-apply");
  const panelClose = document.getElementById("panel-close");
  let spec = null;

  function slider(name, label, min, max, step, value, fmt) {
    const wrap = document.createElement("div");
    wrap.className = "row";
    const head = document.createElement("label");
    head.textContent = label;
    const out = document.createElement("output");
    head.appendChild(out);
    const input = document.createElement("input");
    input.type = "range";
    input.min = min; input.max = max; input.step = step; input.value = value;
    input.dataset.name = name;
    const sync = () => { out.textContent = fmt(input.value); };
    input.addEventListener("input", sync);
    sync();
    wrap.append(head, input);
    return wrap;
  }

  function choice(name, label, options, value) {
    const wrap = document.createElement("div");
    wrap.className = "row";
    const head = document.createElement("label");
    head.textContent = label;
    const select = document.createElement("select");
    select.dataset.name = name;
    options.forEach((opt) => {
      const o = document.createElement("option");
      o.value = String(opt);
      o.textContent = String(opt);
      if (String(opt) === String(value)) o.selected = true;
      select.appendChild(o);
    });
    wrap.append(head, select);
    return wrap;
  }

  function toggle(name, label, value) {
    const row = document.createElement("div");
    row.className = "toggle";
    const text = document.createElement("span");
    text.textContent = label;
    const box = document.createElement("label");
    box.className = "switch";
    const input = document.createElement("input");
    input.type = "checkbox";
    input.checked = !!value;
    input.dataset.name = name;
    box.append(input, document.createElement("i"));
    row.append(text, box);
    return row;
  }

  const mbits = (text) => {
    const m = /^([\d.]+)\s*M$/i.exec(String(text));
    return m ? Math.round(parseFloat(m[1])) : 4;
  };

  function buildForm(data) {
    const s = data.settings, lim = data.limits;
    panelBody.textContent = "";
    panelBody.appendChild(slider("bitrate", "bitrate", Math.round(lim.bitrate.min / 1048576),
      Math.round(lim.bitrate.max / 1048576), 1, mbits(s.bitrate), (v) => v + " Mbit/s"));
    const fpsList = [30, 40, 60, 72, 90];
    if (!fpsList.includes(s.fps)) fpsList.push(s.fps);
    panelBody.appendChild(choice("fps", "frame rate", fpsList.sort((a, b) => a - b), s.fps));
    panelBody.appendChild(choice("layout", "layout", data.layouts, s.layout));
    panelBody.appendChild(slider("threads", "x264 threads (0 = auto)", lim.threads.min, lim.threads.max,
      1, s.threads, (v) => (Number(v) === 0 ? "auto" : v)));
    panelBody.appendChild(slider("nice", "priority (nice, higher = kinder to the game)",
      lim.nice.min, lim.nice.max, 1, s.nice, (v) => v));
    panelBody.appendChild(toggle("adapt", "lower bitrate when the encoder cannot keep up", s.adapt));
    panelBody.appendChild(toggle("record", "record to disk", s.record));
    panelBody.appendChild(slider("record_time", "chunk length", Math.max(30, lim.record_time.min),
      Math.min(900, lim.record_time.max), 30, s.record_time,
      (v) => (Number(v) / 60).toFixed(Number(v) % 60 ? 1 : 0) + " min"));
    panelBody.appendChild(toggle("gaze", "eye tracking reticle", s.gaze));
  }

  function readForm() {
    const values = {};
    panelBody.querySelectorAll("input[data-name], select[data-name]").forEach((el) => {
      const name = el.dataset.name;
      if (el.type === "checkbox") values[name] = el.checked;
      else if (name === "bitrate") values[name] = el.value + "M";
      // a <select> hands back its label ("mono-flat"); Number() would turn that into NaN and the
      // server would rightly refuse it
      else if (el.tagName === "SELECT") values[name] = Number.isNaN(Number(el.value)) ? el.value : Number(el.value);
      else values[name] = Number(el.value);
    });
    return values;
  }

  async function openPanel() {
    panel.classList.add("on");
    panelState.className = "state";
    panelState.textContent = "loading…";
    try {
      const res = await fetch(qs("api/settings"));
      if (!res.ok) throw new Error("http " + res.status);
      spec = await res.json();
      buildForm(spec);
      panelState.textContent = spec.persisted
        ? "remembered in " + spec.persisted
        : "not remembered (memory only)";
    } catch (err) {
      panelState.textContent = "cannot read settings: " + err.message;
      panelState.className = "state err";
    }
  }

  function closePanel() { panel.classList.remove("on"); }

  async function applyPanel() {
    if (!spec) return;
    const next = readForm();
    const diff = {};
    Object.keys(next).forEach((name) => {
      if (JSON.stringify(next[name]) !== JSON.stringify(spec.settings[name])) diff[name] = next[name];
    });
    if (!Object.keys(diff).length) {
      panelState.textContent = "nothing changed";
      panelState.className = "state";
      return;
    }
    const restarts = Object.keys(diff).some((name) => (spec.restart_fields || []).includes(name));
    panelApply.disabled = panelClose.disabled = true;
    panelState.className = "state";
    panelState.textContent = restarts ? "applying — the encoder restarts, the picture blinks…" : "applying…";
    try {
      const res = await fetch(qs("api/settings"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(diff),
      });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || ("http " + res.status));
      spec.settings = body.settings;
      buildForm(spec);
      panelState.textContent = (body.restarted ? "applied — encoder restarted" : "applied") +
        ((body.notes && body.notes.length) ? " · " + body.notes.join(" · ") : "");
      panelState.className = "state ok";
      if (mode === "hls") restartHls("settings changed");
      else beacon("settings changed");
    } catch (err) {
      panelState.textContent = err.message;
      panelState.className = "state err";
      buildForm(spec);       // the server put the old values back; show what is really running
    } finally {
      panelApply.disabled = panelClose.disabled = false;
    }
  }

  document.getElementById("settings").onclick = () =>
    (panel.classList.contains("on") ? closePanel() : openPanel());
  panelClose.onclick = closePanel;
  panelApply.onclick = applyPanel;

  document.addEventListener("keydown", (e) => {
    if (e.key === "t") { hud.classList.toggle("on"); renderHud(); }
    if (e.key === "f") document.getElementById("fs").click();
    if (e.key === "m") modeBtn.click();
    if (e.key === "c") document.body.classList.toggle("clean");
    if (e.key === "g") gazeSet(!gazeOn);
    if (e.key === "s") document.getElementById("settings").click();
    if (e.key === "Escape") closePanel();
  });
})();
</script>
</body>
</html>
