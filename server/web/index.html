<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>vrstream — live VR view</title>
<style>
  :root { color-scheme: dark; --fg:#e8e8ef; --dim:#8a8a98; --accent:#6ee7b7; }
  * { box-sizing: border-box; }
  html,body { margin:0; height:100%; background:#0b0b0f; color:var(--fg);
              font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; }
  video { position:fixed; inset:0; width:100%; height:100%; object-fit:contain; background:#000; }
  #msg { position:fixed; left:0; right:0; bottom:calc(18px + env(safe-area-inset-bottom));
         text-align:center; font-size:14px; color:var(--dim); pointer-events:none; }
  #hud { position:fixed; left:12px; top:calc(12px + env(safe-area-inset-top)); padding:8px 12px;
         border-radius:10px; background:rgba(10,10,14,.62); backdrop-filter:blur(8px);
         font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim);
         opacity:0; transition:opacity .25s; pointer-events:none; white-space:pre; }
  #hud.on { opacity:1; }
  #hud b { color:var(--accent); font-weight:600; }
  #bar { position:fixed; right:12px; top:calc(12px + env(safe-area-inset-top)); display:flex; gap:8px; }
  #bar button { font:12px/1 inherit; color:var(--fg); background:rgba(10,10,14,.62);
         border:1px solid rgba(255,255,255,.14); border-radius:9px; padding:8px 11px; cursor:pointer;
         backdrop-filter:blur(8px); }
  #bar button:hover { border-color:var(--accent); color:var(--accent); }
  body.clean #bar, body.clean #hud, body.clean #msg, body.clean #gaze { display:none; }
  #gaze { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; }
  #stale { position:fixed; left:50%; top:calc(10px + env(safe-area-inset-top)); transform:translateX(-50%);
           background:#b45309ee; color:#fff; font:600 13px/1.4 system-ui,sans-serif; padding:6px 12px;
           border-radius:999px; display:none; z-index:6; pointer-events:none }
  #stale.on { display:block }
  #gazebadge { position:fixed; left:12px; bottom:calc(12px + env(safe-area-inset-bottom));
        font:11px/1 ui-monospace,Menlo,monospace; color:var(--dim); opacity:.85; padding:6px 9px;
        border-radius:8px; background:rgba(10,10,14,.62); display:none; }
  #bar button.on { border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<video id="v" playsinline autoplay muted controls></video>
<canvas id="gaze"></canvas>
<div id="gazebadge"></div>
<div id="stale"></div>
<div id="msg">connecting…</div>
<div id="hud"></div>
<div id="bar">
  <button id="mode" title="switch transport">webrtc</button>
  <button id="stats" title="toggle stats (t)">stats</button>
  <button id="gazebtn" title="eye tracking reticle (g)">gaze</button>
  <button id="fs" title="fullscreen (f)">⤢</button>
</div>
<script>
(function () {
  "use strict";
  const TOKEN = "__TOKEN__";
  const LAYOUT = "__LAYOUT__";
  // explicit --webrtc-url wins, otherwise assume MediaMTX sits on the same host
  const WHEP = ("__WEBRTC__" || (location.protocol + "//" + location.hostname + ":8889/vr"))
               .replace(/\/+$/, "") + "/whep";

  const v = document.getElementById("v");
  const msg = document.getElementById("msg");
  const hud = document.getElementById("hud");
  const modeBtn = document.getElementById("mode");
  const qs = (s) => (TOKEN ? s + (s.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(TOKEN) : s);

  const wantHls = location.hash.includes("hls") || new URLSearchParams(location.search).has("hls");
  const isApple = /iPad|iPhone|iPod/.test(navigator.userAgent);
  let mode = wantHls || isApple || !window.RTCPeerConnection ? "hls" : "webrtc";

  let lastTime = -1, lastMove = Date.now(), restarts = 0, restarting = false;
  let status = null, pc = null, whepUrl = null, lastBytes = 0, kbps = 0;

  const say = (text) => { if (msg.textContent !== text) msg.textContent = text; };
  const beacon = (text) => { try { fetch(qs("log?e=" + encodeURIComponent(mode + " " + text))); } catch (e) {} };
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  // ---------------------------------------------------------------- HLS
  function attachHls() {
    restarting = false;
    v.srcObject = null;
    v.src = qs("live.m3u8?t=" + Date.now());
    lastMove = Date.now(); lastTime = -1;
    const p = v.play();
    if (p && p.catch) p.catch(() => say("tap the video to start"));
  }

  function restartHls(why) {
    if (restarting) return;
    restarting = true; restarts++;
    if (restarts >= 2 && !wantHls && window.RTCPeerConnection) {
      beacon("hls keeps failing — switching to webrtc");
      setMode("webrtc");
      return;
    }
    say("reconnecting (" + why + ")…");
    beacon(why + " restarts=" + restarts);
    try { v.pause(); } catch (e) {}
    v.removeAttribute("src"); v.load();
    setTimeout(attachHls, 400 + Math.min(restarts * 300, 2500));
  }

  // ---------------------------------------------------------------- WebRTC (WHEP)
  async function startWhep() {
    say("connecting (webrtc)…");
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.addTransceiver("video", { direction: "recvonly" });
    pc.addTransceiver("audio", { direction: "recvonly" });
    pc.ontrack = (ev) => {
      if (ev.streams && ev.streams[0]) v.srcObject = ev.streams[0];
      v.play().catch(() => say("tap the video to start"));
      restarts = 0;
    };
    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "failed" || pc.connectionState === "disconnected") {
        beacon("pc " + pc.connectionState);
        teardown(); setTimeout(() => (mode === "webrtc" ? startWhep().catch(fallbackHls) : null), 1500);
      }
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    await new Promise((res) => {                 // non-trickle: wait for candidates
      if (pc.iceGatheringState === "complete") return res();
      const done = () => pc.iceGatheringState === "complete" && res();
      pc.addEventListener("icegatheringstatechange", done);
      setTimeout(res, 2500);
    });

    const res = await fetch(WHEP, {
      method: "POST",
      headers: { "Content-Type": "application/sdp" },
      body: pc.localDescription.sdp,
    });
    if (!res.ok) throw new Error("whep " + res.status);
    whepUrl = res.headers.get("Location") || null;
    await pc.setRemoteDescription({ type: "answer", sdp: await res.text() });
    say("");
  }

  function teardown() {
    if (pc) { try { pc.close(); } catch (e) {} pc = null; }
    if (whepUrl) { try { fetch(new URL(whepUrl, WHEP).href, { method: "DELETE" }); } catch (e) {} whepUrl = null; }
    v.srcObject = null;
  }

  function fallbackHls(err) {
    beacon("webrtc failed: " + (err && err.message));
    mode = "hls"; syncModeButton();
    say("webrtc unavailable — using HLS");
    attachHls();
  }

  function startWebrtc() {
    startWhep().catch(fallbackHls);
  }

  // ---------------------------------------------------------------- mode
  function syncModeButton() { modeBtn.textContent = mode === "hls" ? "hls" : "webrtc"; }

  function setMode(next) {
    if (next === mode) return;
    teardown();
    try { v.pause(); } catch (e) {}
    v.removeAttribute("src"); v.load();
    mode = next; syncModeButton(); restarts = 0;
    if (mode === "hls") attachHls(); else startWebrtc();
  }

  modeBtn.onclick = () => setMode(mode === "hls" ? "webrtc" : "hls");

  // ---------------------------------------------------------------- events
  v.addEventListener("error", () => {
    if (mode !== "hls") return;
    const e = v.error;
    beacon("error " + ((e && e.code) || "?") + ":" + ((e && e.message) || ""));
    restartHls("player error");
  });
  v.addEventListener("stalled", () => { if (mode === "hls") beacon("stalled t=" + v.currentTime.toFixed(1)); });
  v.addEventListener("waiting", () => { if (mode === "hls") beacon("waiting t=" + v.currentTime.toFixed(1)); });
  v.addEventListener("playing", () => { restarts = 0; lastMove = Date.now(); say(""); });

  if (mode === "hls") attachHls(); else startWebrtc();
  syncModeButton();

  // a frozen HTTP stream does not always fire an error - watch the clock
  setInterval(() => {
    if (mode !== "hls" || v.paused || v.ended) return;
    if (v.currentTime !== lastTime) { lastTime = v.currentTime; lastMove = Date.now(); return; }
    if (lastTime > 0.5 && Date.now() - lastMove > 5000) restartHls("frozen");
  }, 1000);

  // status polling doubles as the keep-alive for the on-demand encoder
  setInterval(() => {
    fetch(qs("status?t=" + Date.now())).then((r) => r.json()).then((j) => {
      status = j;
      if (j.fps < 5) say("VR is not rendering — put the headset on or start a game");
      else if (v.currentTime > 0 || (pc && pc.connectionState === "connected")) say("");
      // the playlist keeps rolling from the last frames, so the server is the only honest clock
      const pic = j.picture || {};
      if (pic.frozen && pic.age != null) showStale("picture frozen — last frame " + pic.age.toFixed(0) + " s ago");
      else if (pic.age != null && pic.age > 3) showStale("picture is " + pic.age.toFixed(0) + " s old");
      else showStale("");
      renderHud();
    }).catch(() => {});
  }, 3000);

  const staleEl = document.getElementById("stale");
  function showStale(text) {
    staleEl.textContent = text;
    staleEl.classList.toggle("on", !!text);
  }

  function renderHud() {
    if (!hud.classList.contains("on") || !status) return;
    let transport;
    if (mode === "hls") {
      const buffered = v.buffered.length ? (v.buffered.end(v.buffered.length - 1) - v.currentTime) : 0;
      transport = "hls   buffer " + buffered.toFixed(1) + " s\n";
    } else {
      transport = "webrtc  " + (pc ? pc.connectionState : "off") + "\n";
    }
    hud.innerHTML =
      "capture   <b>" + status.fps.toFixed(1) + "</b> fps\n" +
      "encoder   " + (status.encoder ? "<b>on</b>" : "off") + "  " + (status.bitrate || "") + "  " + LAYOUT + "\n" +
      transport +
      "restarts  " + status.restarts + "  (player " + restarts + ")\n" +
      "picture   " + (status.picture && status.picture.age != null
        ? status.picture.age.toFixed(1) + " s old (" + status.picture.source + ")"
          + (status.picture.torn ? "  torn " + status.picture.torn : "")
        : "no frame yet") + "\n" +
      "record    " + (status.record && status.record.enabled
        ? '<a href="' + qs("recordings") + '">' + status.record.files + " file(s), "
          + (status.record.bytes / 1048576).toFixed(0) + " MB</a>"
        : "off") + "\n" +
      "viewers   " + status.readers +
      (status.gaze && status.gaze.enabled
        ? "\ngaze      " + (status.gaze.available
            ? "<b>" + status.gaze.rate.toFixed(0) + "</b> Hz  age " + status.gaze.age + " s"
            : "off (" + (status.gaze.error || "no data") + ")")
        : "");
  }

  // ---------------------------------------------------------------- gaze
  // The eye server publishes head-relative gaze; the picture is one eye's view, so the reticle is
  // placed with the --gaze-fov rectangle. It is a read-out, not a headset-accurate projection.
  const gcanvas = document.getElementById("gaze");
  const gctx = gcanvas.getContext("2d");
  const gbadge = document.getElementById("gazebadge");
  const gbtn = document.getElementById("gazebtn");
  let es = null, gazeTimer = null, sample = null, trail = [];
  let gazeOn = localStorage.getItem("vrstream.gaze") === "1";

  function sizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    gcanvas.width = Math.round(innerWidth * dpr);
    gcanvas.height = Math.round(innerHeight * dpr);
    gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  sizeCanvas();
  addEventListener("resize", sizeCanvas);

  function videoRect() {
    if (!v.videoWidth) return { x: 0, y: 0, w: innerWidth, h: innerHeight };   // no picture yet
    const vw = v.videoWidth, vh = v.videoHeight;
    const scale = Math.min(innerWidth / vw, innerHeight / vh);
    const w = vw * scale, h = vh * scale;
    return { x: (innerWidth - w) / 2, y: (innerHeight - h) / 2, w, h };
  }

  function draw() {
    gctx.clearRect(0, 0, innerWidth, innerHeight);
    if (!gazeOn) return;
    if (sample && sample.available && typeof sample.x === "number") {
      const r = videoRect();
      const px = r.x + ((sample.x + 1) / 2) * r.w;
      const py = r.y + ((1 - sample.y) / 2) * r.h;
      trail.push([px, py]);
      if (trail.length > 14) trail.shift();
      trail.forEach(([tx, ty], i) => {
        const a = (i + 1) / trail.length;
        gctx.beginPath();
        gctx.arc(tx, ty, 2 + 5 * a, 0, Math.PI * 2);
        gctx.fillStyle = "rgba(110,231,183," + (0.05 + 0.18 * a) + ")";
        gctx.fill();
      });
      gctx.beginPath();
      gctx.arc(px, py, 9, 0, Math.PI * 2);
      gctx.strokeStyle = "rgba(110,231,183,.95)"; gctx.lineWidth = 2; gctx.stroke();
      gctx.beginPath();
      gctx.arc(px, py, 2.5, 0, Math.PI * 2);
      gctx.fillStyle = "rgba(110,231,183,.95)"; gctx.fill();
      gbadge.style.display = "block";
      gbadge.textContent = "gaze " + Math.round(sample.yaw) + "° / " + Math.round(sample.pitch) +
                           "°  lids " + sample.open_l.toFixed(2) + " " + sample.open_r.toFixed(2);
    }
  }

  function gazeConnect() {
    if (es) return;
    es = new EventSource(qs("gaze.sse"));
    es.onmessage = (ev) => {
      try { sample = JSON.parse(ev.data); } catch (e) { return; }
      gbtn.classList.toggle("on", !!sample.available);
      if (!sample.available) {
        gbadge.style.display = "block";
        gbadge.textContent = "gaze: " + (sample.error || "no data from the eye server");
      }
    };
    es.onerror = () => { sample = null; };
  }

  function gazeSet(on) {
    gazeOn = on;
    localStorage.setItem("vrstream.gaze", on ? "1" : "0");
    gbtn.classList.toggle("on", on);
    // a plain interval, not requestAnimationFrame: rAF is throttled to zero in a background tab,
    // which is exactly where a stream like this often runs
    if (on) { gazeConnect(); if (!gazeTimer) gazeTimer = setInterval(draw, 33); }
    else {
      if (gazeTimer) { clearInterval(gazeTimer); gazeTimer = null; }
      if (es) { es.close(); es = null; }
      sample = null; trail = [];
      gctx.clearRect(0, 0, innerWidth, innerHeight); gbadge.style.display = "none";
    }
  }
  gbtn.onclick = () => gazeSet(!gazeOn);
  if (gazeOn) gazeSet(true);

  document.getElementById("stats").onclick = () => { hud.classList.toggle("on"); renderHud(); };
  document.getElementById("fs").onclick = () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(() => {});
  };

  document.addEventListener("keydown", (e) => {
    if (e.key === "t") { hud.classList.toggle("on"); renderHud(); }
    if (e.key === "f") document.getElementById("fs").click();
    if (e.key === "m") modeBtn.click();
    if (e.key === "c") document.body.classList.toggle("clean");
    if (e.key === "g") gazeSet(!gazeOn);
  });
})();
</script>
</body>
</html>
