# MediaMTX config for Stream Frame — low-latency fan-out of the RTSP push from ffmpeg.
# Docs: https://github.com/bluenviron/mediamtx
logLevel: info
logDestinations: [stdout]

# --- RTSP ingest from the daemon (ffmpeg pushes rtsp://127.0.0.1:8554/vr) ---
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp]          # tcp only: udp drops on busy wifi

# --- WebRTC for browsers (WHEP), used by the Steam Deck / phones ---
webrtc: yes
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
# Only the wifi interface goes into the ICE candidates. Left to itself MediaMTX
# offers the tailnet IPv6 address too, and browsers prefer IPv6 — so a Deck on
# the same wifi was streaming through the tailnet, adding hops for no reason.
# Naming the interface instead of an address survives DHCP handing out a new IP.
# Remote viewers lose WebRTC and the page falls back to HLS on its own.
webrtcIPsFromInterfaces: yes
webrtcAdditionalHosts: []
webrtcIPsFromInterfacesList: [wlan0]

# --- HLS is handled by the daemon itself; MediaMTX HLS stays off ---
hls: no

api: yes
apiAddress: 127.0.0.1:9997      # readers count for the idle watchdog, local only

paths:
  vr:
    # Wake the encoder when a player connects and nobody has the web page open.
    # the daemon starts ffmpeg on the first HTTP request, so a single ping is enough.
    runOnDemand: curl -s -m 6 -o /dev/null http://127.0.0.1:8101/wake
    # 0s = never close: the publisher is our own ffmpeg, and dropping it would kill the tee
    # branch for the rest of the session (the daemon decides when to stop encoding).
    runOnDemandCloseAfter: 0s
  all_others:
